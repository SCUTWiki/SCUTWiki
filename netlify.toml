[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_SITE_URL = "https://scutwiki.com"

# 关闭 Pretty URLs：否则 .html 文件会被 301 到无扩展名地址，
# 百度/必应等站点验证（要求验证文件本身返回 200）会失败。
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# Vue Router 用的是 history 模式：直接访问 /more 或刷新页面时，
# Netlify 找不到对应文件会 404，这里统一回退到 index.html 交给前端路由处理。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
